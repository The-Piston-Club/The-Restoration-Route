<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Restoration Route | Garage</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    * { box-sizing: border-box; }

    :root {
      --text: #f6f1e7;
      --muted: rgba(255,255,255,0.78);
      --gold: #c89b3c;
      --gold-dark: #a8781f;
      --panel-border: rgba(255,255,255,0.16);
      --panel-bg-a: rgba(84,84,84,0.96);
      --panel-bg-b: rgba(24,24,24,0.98);
      --frame-size: 14px;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: "Rajdhani", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #4a3d2b 0%, #221d18 42%, #101010 100%);
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background:
        radial-gradient(260px 150px at 10% 12%, rgba(20,12,8,0.34) 0%, transparent 72%),
        radial-gradient(320px 180px at 90% 16%, rgba(18,12,8,0.28) 0%, transparent 74%),
        repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 8px, transparent 8px 32px, rgba(0,0,0,0.04) 32px 36px, transparent 36px 72px);
      mix-blend-mode: screen;
    }

    .page-frame {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 30;
    }

    .page-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, #121212 0 18px, var(--gold) 18px 36px) top / calc(100% - (var(--frame-size) * 2)) var(--frame-size) no-repeat,
        repeating-linear-gradient(90deg, #121212 0 18px, var(--gold) 18px 36px) bottom / calc(100% - (var(--frame-size) * 2)) var(--frame-size) no-repeat,
        repeating-linear-gradient(0deg, #121212 0 18px, var(--gold) 18px 36px) left / var(--frame-size) calc(100% - (var(--frame-size) * 2)) no-repeat,
        repeating-linear-gradient(0deg, #121212 0 18px, var(--gold) 18px 36px) right / var(--frame-size) calc(100% - (var(--frame-size) * 2)) no-repeat,
        linear-gradient(135deg, #121212 0 50%, var(--gold) 50% 100%) top left / var(--frame-size) var(--frame-size) no-repeat,
        linear-gradient(225deg, #121212 0 50%, var(--gold) 50% 100%) top right / var(--frame-size) var(--frame-size) no-repeat,
        linear-gradient(45deg, #121212 0 50%, var(--gold) 50% 100%) bottom left / var(--frame-size) var(--frame-size) no-repeat,
        linear-gradient(-45deg, #121212 0 50%, var(--gold) 50% 100%) bottom right / var(--frame-size) var(--frame-size) no-repeat;
    }

    .page-frame::after {
      content: "";
      position: absolute;
      inset: 16px;
      background:
        radial-gradient(circle, rgba(200,200,200,0.65) 0 2px, rgba(56,56,56,0.95) 2px 6px, transparent 6px) top left,
        radial-gradient(circle, rgba(200,200,200,0.65) 0 2px, rgba(56,56,56,0.95) 2px 6px, transparent 6px) top right,
        radial-gradient(circle, rgba(200,200,200,0.65) 0 2px, rgba(56,56,56,0.95) 2px 6px, transparent 6px) bottom left,
        radial-gradient(circle, rgba(200,200,200,0.65) 0 2px, rgba(56,56,56,0.95) 2px 6px, transparent 6px) bottom right;
      background-size: 12px 12px;
      background-repeat: no-repeat;
      opacity: 0.88;
    }

    .wrap {
      min-height: 100svh;
      padding: 22px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .panel {
      width: min(1180px, 100%);
      min-height: calc(100svh - 44px);
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--panel-border);
      background: linear-gradient(145deg, var(--panel-bg-a), var(--panel-bg-b));
      box-shadow: 0 18px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.18), inset 0 -1px 0 rgba(0,0,0,0.35);
      position: relative;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18px 18px, rgba(214,214,214,0.75) 0 2px, rgba(62,62,62,0.92) 2px 7px, transparent 7px),
        radial-gradient(circle at calc(100% - 18px) 18px, rgba(214,214,214,0.75) 0 2px, rgba(62,62,62,0.92) 2px 7px, transparent 7px),
        radial-gradient(circle at 18px calc(100% - 18px), rgba(214,214,214,0.75) 0 2px, rgba(62,62,62,0.92) 2px 7px, transparent 7px),
        radial-gradient(circle at calc(100% - 18px) calc(100% - 18px), rgba(214,214,214,0.75) 0 2px, rgba(62,62,62,0.92) 2px 7px, transparent 7px);
      z-index: 1;
    }

    .panel-inner {
      position: relative;
      z-index: 2;
      padding: 18px 20px;
      min-height: calc(100svh - 44px);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 12px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .back-link,
    .action-link,
    .action-button,
    .scanner-title,
    .venue-name,
    .detail-title,
    .hours-title,
    .brand-title {
      font-family: "Teko", Arial, sans-serif;
    }

    .back-link,
    .action-link,
    .action-button {
      text-decoration: none;
      color: #1a1205;
      background: linear-gradient(180deg, var(--gold), var(--gold-dark));
      border-radius: 14px;
      padding: 10px 14px;
      min-width: 110px;
      text-align: center;
      font-size: 20px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .back-link.secondary,
    .action-link.secondary,
    .action-button.secondary {
      background: linear-gradient(180deg, #1d1d1d, #0f0f0f);
      color: #f2efe8;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .venue-head {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .venue-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(200,155,60,0.18);
      border: 1px solid rgba(200,155,60,0.35);
      color: #ffe8b0;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      justify-self: start;
    }

    .venue-title-wrap {
      min-width: 0;
      text-align: center;
    }

    .venue-name {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      line-height: 0.94;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .venue-quip {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.25;
      font-weight: 600;
    }

    .compact-layout {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .info-stack,
    .hours-card,
    .action-stack {
      min-height: 0;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .detail-card,
    .hours-card,
    .action-card {
      border-radius: 16px;
      padding: 12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(0,0,0,0.18));
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }

    .detail-title,
    .hours-title {
      margin: 0 0 8px;
      font-size: 24px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
    }

    .detail-lines {
      text-align: center;
      font-size: 16px;
      line-height: 1.35;
      color: rgba(255,255,255,0.9);
    }

    .detail-lines a {
      color: inherit;
      text-decoration: none;
    }

    .hours-grid {
      display: grid;
      gap: 6px;
    }

    .hours-row {
      display: grid;
      grid-template-columns: 84px 1fr;
      gap: 8px;
      align-items: start;
      padding: 6px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
    }

    .hours-day {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffe2a0;
    }

    .hours-time,
    .hours-food {
      text-align: right;
      line-height: 1.25;
    }

    .hours-time { font-size: 14px; }
    .hours-food { font-size: 12px; color: rgba(255,255,255,0.68); margin-top: 2px; }

    .action-stack {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .action-stack .full {
      grid-column: 1 / -1;
    }

    .status {
      display: none;
      padding: 12px 14px;
      border-radius: 14px;
      font-weight: 700;
      backdrop-filter: blur(8px);
    }

    .status.success { display: block; background: rgba(47,125,50,0.2); border: 1px solid rgba(120,210,130,0.4); color: #dff5e1; }
    .status.error { display: block; background: rgba(178,33,33,0.2); border: 1px solid rgba(255,138,138,0.42); color: #ffdede; }
    .status.info { display: block; background: rgba(60,115,200,0.2); border: 1px solid rgba(145,185,255,0.35); color: #e4efff; }
    .hidden { display: none !important; }

    .scanner-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 9999;
    }

    .scanner-overlay.show { display: flex; }

    .scanner-modal {
      width: min(100%, 680px);
      border-radius: 22px;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(90,90,90,0.98), rgba(26,26,26,0.98));
      border: 2px solid rgba(255,255,255,0.16);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.14);
      position: relative;
    }

    .scanner-modal::before,
    .scanner-modal::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 18px;
      background: repeating-linear-gradient(45deg, #0e0e0e 0 14px, #f0c02e 14px 28px);
      z-index: 1;
    }

    .scanner-modal::before { top: 0; }
    .scanner-modal::after { bottom: 0; }

    .scanner-inner {
      position: relative;
      z-index: 2;
      padding: 38px 18px 22px;
      text-align: center;
    }

    .scanner-title {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .scanner-viewport {
      width: 100%;
      max-width: 380px;
      margin: 0 auto 14px;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255,255,255,0.14);
      min-height: 300px;
    }

    #qr-reader { width: 100%; }

    .scanner-help {
      margin: 0 0 16px;
      color: rgba(255,255,255,0.8);
      font-size: 15px;
      line-height: 1.35;
    }

    .scanner-actions {
      display: flex;
      justify-content: center;
    }

    .secret-armed {
      box-shadow: 0 0 0 2px rgba(200,155,60,0.5), 0 0 20px rgba(200,155,60,0.3);
    }

    @media (max-width: 900px) {
      body { overflow-y: auto; }
      .wrap { align-items: stretch; padding: 16px; }
      .panel { min-height: auto; }
      .panel-inner { min-height: auto; }
      .compact-layout { grid-template-columns: 1fr; }
      .action-stack { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .venue-head {
        grid-template-columns: 1fr;
      }

      .venue-badge,
      .back-link {
        justify-self: stretch;
      }

      .detail-grid,
      .action-stack {
        grid-template-columns: 1fr;
      }

      .hours-row {
        grid-template-columns: 1fr;
      }

      .hours-day,
      .hours-time,
      .hours-food {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="page-frame" aria-hidden="true"></div>

  <div class="wrap">
    <div id="statusBox" class="status"></div>

    <div id="venuePanel" class="panel hidden">
      <div class="panel-inner">
        <div class="venue-head">
          <a id="venueBackLink" class="back-link secondary" href="./index.html">Back To Route</a>
          <div class="venue-title-wrap">
            <div id="venuePart" class="venue-badge">Repairs</div>
            <h1 id="venueName" class="venue-name">Garage</h1>
            <p id="venueQuip" class="venue-quip"></p>
          </div>
          <a class="back-link" href="./leaderboard.html">Leaderboard</a>
        </div>

        <div class="compact-layout">
          <div class="info-stack">
            <div class="detail-grid">
              <div class="detail-card">
                <h2 class="detail-title">Address</h2>
                <div id="venueAddress" class="detail-lines"></div>
              </div>
              <div class="detail-card">
                <h2 class="detail-title">Contact</h2>
                <div id="venuePhone" class="detail-lines"></div>
                <div id="venueEmail" class="detail-lines" style="margin-top:8px;"></div>
              </div>
            </div>

            <div class="action-card" style="margin-top:10px;">
              <div id="venueActions" class="action-stack"></div>
            </div>
          </div>

          <div class="hours-card">
            <h2 class="hours-title">Opening Hours</h2>
            <div id="venueHours" class="hours-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="errorPanel" class="panel hidden">
      <div class="panel-inner" style="min-height:auto;display:grid;place-items:center;text-align:center;gap:12px;">
        <h2 class="venue-name" style="font-size:38px;">Garage Not Found</h2>
        <p class="venue-quip">This garage page is missing or invalid.</p>
        <a class="back-link" href="./index.html">Back To Route</a>
      </div>
    </div>
  </div>

  <div id="scannerOverlay" class="scanner-overlay" aria-hidden="true">
    <div class="scanner-modal">
      <div class="scanner-inner">
        <h3 class="scanner-title">Scan Venue QR</h3>
        <div class="scanner-viewport">
          <div id="qr-reader"></div>
        </div>
        <p id="scannerHelp" class="scanner-help">Point your camera at a venue QR code.</p>
        <div class="scanner-actions">
          <button id="closeScannerBtn" class="action-button secondary" type="button">Close Scanner</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <script type="module">
    import { DAY_ORDER, ROUTE_VENUES, ALIAS_MAP, normalizeVenueValue } from "./route-data.js";

    const SECRET_STORAGE_KEY = "chipWorkshopOverride";
    const SECRET_HOLD_MS = 10000;
    const SECRET_PASSWORD = "watson";
    const CAMERA_PERMISSION_HINT_KEY = "restorationRouteCameraPermission";

    const statusBox = document.getElementById("statusBox");
    const venuePanel = document.getElementById("venuePanel");
    const errorPanel = document.getElementById("errorPanel");
    const venuePart = document.getElementById("venuePart");
    const venueName = document.getElementById("venueName");
    const venueQuip = document.getElementById("venueQuip");
    const venueAddress = document.getElementById("venueAddress");
    const venuePhone = document.getElementById("venuePhone");
    const venueEmail = document.getElementById("venueEmail");
    const venueHours = document.getElementById("venueHours");
    const venueActions = document.getElementById("venueActions");
    const venueBackLink = document.getElementById("venueBackLink");
    const scannerOverlay = document.getElementById("scannerOverlay");
    const scannerHelp = document.getElementById("scannerHelp");
    const closeScannerBtn = document.getElementById("closeScannerBtn");

    let secretHoldTimer = null;
    let suppressNextBackClick = false;
    let qrScanner = null;
    let qrScannerRunning = false;
    let qrScanHandled = false;

    function showStatus(message, type = "info", autoHideMs = 0) {
      statusBox.textContent = message;
      statusBox.className = `status ${type}`;
      if (autoHideMs > 0) {
        window.setTimeout(() => {
          if (statusBox.textContent === message) {
            clearStatus();
          }
        }, autoHideMs);
      }
    }

    function clearStatus() {
      statusBox.textContent = "";
      statusBox.className = "status";
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function buildMapUrl(queryText) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryText)}`;
    }

    function getVenueFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const garage = params.get("garage");
      if (!garage) return null;
      const normalized = normalizeVenueValue(garage);
      const resolvedPartKey = ALIAS_MAP[normalized] || normalized;
      return ROUTE_VENUES.find((venue) => venue.partKey === resolvedPartKey) || null;
    }

    function renderOpeningHours(venue) {
      return DAY_ORDER.map((day) => {
        const time = venue.opening?.[day] || "Closed";
        const food = venue.food?.[day] || "";
        return `
          <div class="hours-row">
            <div class="hours-day">${day}</div>
            <div>
              <div class="hours-time">${escapeHtml(time)}</div>
              ${food ? `<div class="hours-food">${escapeHtml(food)}</div>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderSocialLinks(venue) {
      const entries = Object.entries(venue.socials || {}).filter(([, value]) => value);
      if (!entries.length) return "";
      return entries.map(([label, url]) => `
        <a class="action-link secondary" href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>
      `).join("");
    }

    function renderVenue(venue) {
      venuePart.textContent = `Repairs: ${venue.partLabel}`;
      venueName.textContent = venue.name;
      venueQuip.textContent = venue.quip;
      venueAddress.innerHTML = venue.address.map((line) => `<div>${escapeHtml(line)}</div>`).join("");

      venuePhone.innerHTML = venue.phone === "—"
        ? `<div>—</div>`
        : `<div><a href="tel:${venue.phone.replace(/\s+/g, "")}">${escapeHtml(venue.phone)}</a></div>`;

      venueEmail.innerHTML = venue.email === "Use website contact form"
        ? `<div>Use website contact form</div>`
        : venue.email === "—"
          ? `<div>—</div>`
          : `<div><a href="mailto:${escapeHtml(venue.email)}">${escapeHtml(venue.email)}</a></div>`;

      venueHours.innerHTML = renderOpeningHours(venue);
      venueActions.innerHTML = `
        <a class="action-link" href="${venue.website}" target="_blank" rel="noopener noreferrer">Website</a>
        <a class="action-link secondary" href="${buildMapUrl(venue.mapQuery)}" target="_blank" rel="noopener noreferrer">Directions</a>
        <button id="openScannerBtn" class="action-button" type="button">Scan Venue QR</button>
        <a class="action-link secondary" href="./index.html">Route</a>
        ${renderSocialLinks(venue)}
      `;

      document.getElementById("openScannerBtn").addEventListener("click", startScanner);
      venuePanel.classList.remove("hidden");
      errorPanel.classList.add("hidden");
    }

    function normalizeScannedUrl(decodedText) {
      try {
        const resolved = new URL(decodedText, window.location.href);
        if (resolved.protocol !== "http:" && resolved.protocol !== "https:") return null;
        return resolved.href;
      } catch {
        return null;
      }
    }

    async function getCameraPermissionState() {
      if (!navigator.permissions?.query) return "unknown";
      try {
        const permission = await navigator.permissions.query({ name: "camera" });
        return permission?.state || "unknown";
      } catch {
        return "unknown";
      }
    }

    async function stopScanner() {
      if (qrScanner) {
        try {
          if (qrScannerRunning) await qrScanner.stop();
        } catch {}
        try {
          await qrScanner.clear();
        } catch {}
      }
      qrScanner = null;
      qrScannerRunning = false;
      qrScanHandled = false;
    }

    async function closeScannerOverlay() {
      scannerOverlay.classList.remove("show");
      scannerOverlay.setAttribute("aria-hidden", "true");
      scannerHelp.textContent = "Point your camera at a venue QR code.";
      await stopScanner();
    }

    async function handleScanSuccess(decodedText) {
      if (qrScanHandled) return;
      qrScanHandled = true;

      const targetUrl = normalizeScannedUrl(decodedText);
      if (!targetUrl) {
        qrScanHandled = false;
        scannerHelp.textContent = "That QR code did not contain a valid web link.";
        return;
      }

      scannerHelp.textContent = "QR code captured. Opening…";
      await closeScannerOverlay();
      window.location.href = targetUrl;
    }

    async function startScanner() {
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia || typeof window.Html5Qrcode !== "function") {
        showStatus("Camera scanning needs HTTPS and a supported browser camera API.", "error");
        return;
      }

      const permissionState = await getCameraPermissionState();
      if (permissionState === "denied") {
        showStatus("Camera access is blocked for this browser or site. Please allow camera access in your browser settings.", "error");
        return;
      }

      scannerOverlay.classList.add("show");
      scannerOverlay.setAttribute("aria-hidden", "false");
      scannerHelp.textContent = permissionState === "granted" || localStorage.getItem(CAMERA_PERMISSION_HINT_KEY) === "granted"
        ? "Opening camera…"
        : "Starting camera…";

      await stopScanner();
      qrScanner = new window.Html5Qrcode("qr-reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1 };

      try {
        await qrScanner.start({ facingMode: { exact: "environment" } }, config, handleScanSuccess, () => {});
        qrScannerRunning = true;
        localStorage.setItem(CAMERA_PERMISSION_HINT_KEY, "granted");
        scannerHelp.textContent = "Point your camera at a venue QR code.";
        return;
      } catch {}

      try {
        await qrScanner.start({ facingMode: "environment" }, config, handleScanSuccess, () => {});
        qrScannerRunning = true;
        localStorage.setItem(CAMERA_PERMISSION_HINT_KEY, "granted");
        scannerHelp.textContent = "Point your camera at a venue QR code.";
        return;
      } catch {}

      try {
        const cameras = await window.Html5Qrcode.getCameras();
        if (!cameras || cameras.length === 0) throw new Error("No camera found.");
        const backCamera = cameras.find((camera) => /back|rear|environment/i.test(camera.label)) || cameras[cameras.length - 1];
        await qrScanner.start(backCamera.id, config, handleScanSuccess, () => {});
        qrScannerRunning = true;
        localStorage.setItem(CAMERA_PERMISSION_HINT_KEY, "granted");
        scannerHelp.textContent = "Point your camera at a venue QR code.";
      } catch (error) {
        await closeScannerOverlay();
        showStatus(error?.message || "Could not start the camera scanner.", "error");
      }
    }

    function clearSecretHold() {
      if (secretHoldTimer) {
        clearTimeout(secretHoldTimer);
        secretHoldTimer = null;
      }
      venueBackLink.classList.remove("secret-armed");
    }

    function unlockSecretAndReturn() {
      const enteredPassword = window.prompt("Workshop override password:");
      if (enteredPassword === null) {
        showStatus("Workshop override cancelled.", "info", 2500);
        return;
      }

      if (enteredPassword.trim().toLowerCase() === SECRET_PASSWORD) {
        localStorage.setItem(SECRET_STORAGE_KEY, "unlocked");
        showStatus("Workshop override unlocked. Returning to the route.", "success", 1800);
        window.setTimeout(() => {
          window.location.href = "./index.html";
        }, 1000);
      } else {
        showStatus("Incorrect password.", "error", 4000);
      }
    }

    function wireSecretUnlockForVenue(venue) {
      if (venue.partKey !== "transmission") return;

      venueBackLink.addEventListener("pointerdown", () => {
        clearSecretHold();
        venueBackLink.classList.add("secret-armed");
        secretHoldTimer = window.setTimeout(() => {
          suppressNextBackClick = true;
          clearSecretHold();
          unlockSecretAndReturn();
        }, SECRET_HOLD_MS);
      });

      venueBackLink.addEventListener("pointerup", clearSecretHold);
      venueBackLink.addEventListener("pointercancel", clearSecretHold);
      venueBackLink.addEventListener("pointerleave", clearSecretHold);
      venueBackLink.addEventListener("click", (event) => {
        if (suppressNextBackClick) {
          event.preventDefault();
          suppressNextBackClick = false;
        }
      });
    }

    closeScannerBtn.addEventListener("click", closeScannerOverlay);
    scannerOverlay.addEventListener("click", async (event) => {
      if (event.target === scannerOverlay) {
        await closeScannerOverlay();
      }
    });
    window.addEventListener("beforeunload", () => stopScanner());

    function initPage() {
      clearStatus();
      const venue = getVenueFromUrl();
      if (!venue) {
        venuePanel.classList.add("hidden");
        errorPanel.classList.remove("hidden");
        showStatus("This garage page is invalid or missing.", "error");
        return;
      }
      renderVenue(venue);
      wireSecretUnlockForVenue(venue);
    }

    initPage();
  </script>
</body>
</html>
